<?xml version="1.0" encoding="UTF-8"?>
<!--
  背景装飾用のタイルパターン。
  app/page.tsx と app/event/page.tsx の計6箇所で
  `bg-[url('/images/pattern.svg')] opacity-5` として敷かれる。

  40x40 のタイルで、中心と四隅にドットを置く。四隅のドットは隣接タイルと
  合成されて1つの点になるため、繰り返しても継ぎ目が出ない。
  実際の表示は opacity 5% なので、色はここでは濃いめに取っている。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <g fill="#4c1d95">
    <circle cx="20" cy="20" r="1.5"/>
    <circle cx="0" cy="0" r="1.5"/>
    <circle cx="40" cy="0" r="1.5"/>
    <circle cx="0" cy="40" r="1.5"/>
    <circle cx="40" cy="40" r="1.5"/>
  </g>
</svg>
